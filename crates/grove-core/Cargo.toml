[package]
name = "grove-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2.191"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
