[package]
name = "grove-mcp"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "grove_mcp"
path = "src/lib.rs"

[[bin]]
name = "grove-mcp"
path = "src/main.rs"

[[bin]]
name = "grovecode"
path = "src/grovecode.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
grove-core = { path = "../grove-core" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
