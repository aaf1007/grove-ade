[package]
name = "grove"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
grove-core = { path = "../../crates/grove-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tokio = { version = "1.54.1", features = ["sync"] }
